  <body>
    <nav>
      <div class="nav-bar">
        <a href="index.html"
          ><image
            src="images/icon.png"
            alt="icon"
            class="nav-icon"
            width="50px"

        <div class="nav-title">Simple Tools</div>

        <a href="index.html" class="nav-link">Home</a>

        <a href="contact.html" class="nav-link">Contact</a>
      </div>
    </nav>
    <!-- header -->
    <header>
      <div class="header2">Contact</div>
      <div class="header-explanation2"><><><><><><><><><><><></div>
    </header>
    <!-- 40px of space between header and grid -->
    <div class="spacerx40"></div>

    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- Replace with your Access Key -->
      <input
        type="hidden"
        name="access_key"
        value="63640f00-f2bc-431b-a241-6717662a08ac"
      />

      <!-- Form Inputs. Each input must have a name="" attribute -->
      <input placeholder="Name" type="text" name="name" required />
      <input placeholder="Email" type="email" name="email" required />
      <textarea
        placeholder="Report problem/suggestions/link to wanted addition"
        name="message"
        required
      ></textarea>
      <!-- <input
        placeholder="Link to wanted addition:optional"
        type="text"
        name="link"
      /> -->

      <!-- Honeypot Spam Protection -->
      <input
        type="checkbox"
        name="botcheck"
        class="hidden"
        style="display: none"
      />

      <!-- Custom Confirmation / Success Page -->
      <input
        type="hidden"
        name="redirect"
        value="https://wadeplumb.github.io/thanks.html"
      />

      <button type="submit">Submit Form</button>
    </form>
  </body>
